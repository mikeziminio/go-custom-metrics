version: '3'

env:
  BIN: "{{.PWD}}/bin"

tasks:
  build:
    desc: Build all, specify args after --
    cmds:
      - "go build -o $BIN/server {{.CLI_ARGS}} ./cmd/server"
      - "go build -o $BIN/agent {{.CLI_ARGS}} ./cmd/agent"

  server:
    desc: Run server, specify args after --
    cmds:
      - "go build -o $BIN/server ./cmd/server"
      - "$BIN/server {{.CLI_ARGS}}"

  server-with-postgres:
    desc: Run server, specify args after --
    cmds:
      - "go build -o $BIN/server ./cmd/server"
      - "$BIN/server -d 'postgres://postgres:postgres@localhost:5432/praktikum?sslmode=disable' {{.CLI_ARGS}}"

  agent:
    desc: Run agent, specify args after --
    cmds:
      - "go build -o $BIN/agent ./cmd/agent"
      - "$BIN/agent -p 1 -r 1 {{.CLI_ARGS}}"

  postgres-up:
    desc: Docker compose up postgres container
    cmds:
      - docker compose -f docker-compose-postgres.yml up -d

  postgres-ps:
    desc: Docker compose status postgres container
    cmds:
      - docker compose -f docker-compose-postgres.yml ps

  postgres-psql:
    desc: Run psql inside postgres container
    cmds:
      - docker compose run -it postgres "psql" "postgres://postgres:postgres@postgres:5432/praktikum?sslmode=disable"

  postgres-down:
    desc: Docker compose down postgres container
    cmds:
      - docker compose -f docker-compose-postgres.yml down --remove-orphans

  test-all-build:
    desc: Rebuild docker image for yandex tests
    cmds:
      - docker compose build --no-cache

  test-all:
    desc: Run all linters and tests
    cmds:
      # - task lint
      # - task test
      - docker compose down --remove-orphans
      - docker compose up

  test:
    desc: Run local unit tests
    cmds:
      - "go test -v -race ./..."

  test-load:
    desc: Run k6 load tests. You should run server-with-postgres before
    cmds:
      - "k6 run test-load.js"

  pprof-heap:
    desc: Save heap profile
    cmds:
      - "curl -s http://localhost:7070/debug/pprof/heap -o ./profile/{{.FILENAME}}.pprof"

  fmt:
    desc: Format and fix imports
    cmds:
      - "gofmt -w ."
      - "goimports -w -local \"github.com/mikeziminio/go-custom-metrics\" ."

  lint-prepare:
    desc: Install golangci-lint and nilaway, verify golangci-lint config
    cmds:
      - "GOBIN=$BIN go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.4.0"
      - "GOBIN=$BIN go install go.uber.org/nilaway/cmd/nilaway@latest"
      - "$BIN/golangci-lint cache clean"
      - "$BIN/golangci-lint config verify"

  lint:
    desc: Run linters
    cmds:
      - "$BIN/golangci-lint run -c .golangci.yml"
      - "$BIN/nilaway -pretty-print=true ./..."

  migrate-prepare:
    desc: Install golang-migrate
    cmds:
      - "GOBIN=$BIN go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest"

  migrate-create:
    desc: Create migration, specify name with -- name
    cmds:
      - "$BIN/migrate create -ext sql -dir ./migrations -seq {{.CLI_ARGS}}"

  migrate-up:
    desc: Run migrate up
    cmds:
      - "$BIN/migrate -database 'postgres://postgres:postgres@localhost:5432/praktikum?sslmode=disable' -path ./migrations up"

  mockery:
    desc: Run mockery - update mock files
    cmds:
      - mockery

  default:
    cmds:
      - "task -l"
      - "echo Bin directory: $BIN"
    silent: true

  doc:
    desc: Generate Go documentation and serve it
    cmds:
      - "godoc -play -http=:6060 & sleep 2"
      - "open http://localhost:6060/pkg/github.com/mikeziminio/go-custom-metrics/?m=all"

  swag-prepare:
    desc: Install latest swag to bin dir
    cmds:
      - "GOBIN=$BIN go install github.com/swaggo/swag/v2/cmd/swag@latest"

  swag:
     desc: Format swagger comments and update swagger.yaml
     cmds:
      - "$BIN/swag fmt  -d './internal/server,./internal/model' -g 'handler.go'"
      - "$BIN/swag init --v3.1 -d './internal/server,./internal/model' -g 'handler.go' -o ./swagger/ -ot 'json,yaml'"

  reset:
    desc: Generate reset methods for structures with // generate:reset comments
          Specify path with -- path
    cmds:
      - "go build -o $BIN/reset ./cmd/reset"
      - "$BIN/reset {{.CLI_ARGS}}"

  proto-generate:
    desc: Generate Go code from proto files
    cmds:
      - "protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative internal/proto/metrics/metrics.proto"
