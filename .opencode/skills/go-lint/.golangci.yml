# Go Linting Configuration
# Based on standard golangci-lint configuration

run:
  deadline: 5m
  tests: true

linters:
  enable-all: true
  disable:
    - maligned
    - prealloc
    - gomnd
    - godot
    - goerr113
    - exhaustruct
    - nonamedreturns
    - wrapcheck
    - gocognit
    - dupl
    - cyclop
    - funlen
    - gocyclo
    - wsl
    - gofumpt
    - nlreturn
    - gci
    - gomoddirectives
    - gosec
    - gosimple
    - staticcheck
    - unused
    - varnamelen
    - revive
    - stylecheck
    - tparallel
    - testpackage
    - unparam
    - unused
    - whitespace

linters-settings:
  gocritic:
    enabled-checks:
      - appendCombine
      - assignOp
      - bigShadow
      - boolExprSimplify
      - builtinShadow
      - captLocal
      - commentFormatting
      - commentedOutCode
      - deferInLoop
      - docStub
      - duplicateBranch
      - emptyBlock
      - emptyDecl
      - emptyFallthrough
      - emptyReturn
      - equalFold
      - equalImport
      - errorNakedReturn
      - errorString
      - errorf
      - exitAfterDefer
      - exportLoopRef
      - externalErrorRecovery
      - filepathJoin
      - hugeParam
      - importShadow
      - indexAlloc
      - initClause
      - interfacePadding
      - invokeInline
      - methodExprCall
      - nilValReturn
      - octalLiteral
      - paramTypeCombine
      - rangeExprCopy
      - rangeValCopy
      - regexpMust
      - returnAfterLog
      - ruleguard
      - sortSlice
      - sprintfQuotedString
      - stringXbytes
      - strongName
      - testifylint
      - typeAssertChain
      - typeUnparen
      - unlambda
      - unnamedResult
      - unreachableCode
      - unslice
      - useStringer
      - uselessBreak
      - wrapperFunc
      - yodaStyleExpr
    disabled-checks:
      - govet
      - godot
      - gomnd
      - goerr113
      - exhaustruct
      - nonamedreturns
      - wrapcheck
      - gocognit
      - dupl
      - cyclop
      - funlen
      - gocyclo
      - wsl
      - gofumpt
      - nlreturn
      - gci
      - gomoddirectives
      - gosec
      - gosimple
      - staticcheck
      - unused
      - varnamelen
      - revive
      - stylecheck
      - tparallel
      - testpackage
      - unparam
      - unused
      - whitespace

# Additional configuration for better Go development experience
issues:
  # Maximum count of issues with the same text
  max-same-issues: 10

# Enable or disable rules for specific files
# exclude-rules:
#   - path: _test\.go
#     linters:
#       - gomnd